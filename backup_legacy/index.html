<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamFlow | Flow State Music</title>

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        charcoal: { DEFAULT: '#0d0d0f', 800: '#15151a', 900: '#0d0d0f' },
                        violet: { DEFAULT: '#8b5cf6', glow: '#a78bfa', dark: '#6d28d9' }
                    },
                    fontFamily: { sans: ['Outfit', 'sans-serif'] }
                }
            }
        }
    </script>

    <!-- Physics & Styles -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="bg-charcoal text-white overflow-hidden selection:bg-violet-500 selection:text-white">

    <!-- Physics Canvas -->
    <canvas id="physics-canvas"></canvas>

    <!-- App Container -->
    <div id="app" class="relative z-10 flex h-screen">

        <!-- Sidebar -->
        <aside id="sidebar"
            class="physics-element w-64 h-full bg-charcoal-800/50 backdrop-blur-xl border-r border-white/5 flex flex-col p-6 z-20 transition-transform duration-300">
            <!-- Brand -->
            <div class="flex items-center gap-3 mb-10 cursor-pointer" onclick="window.router.navigate('/')">
                <div
                    class="w-10 h-10 rounded-2xl bg-gradient-to-br from-violet-dark to-violet-DEFAULT flex items-center justify-center shadow-lg shadow-violet-DEFAULT/20">
                    <svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3" />
                    </svg>
                </div>
                <span class="text-xl font-bold tracking-tight">StreamFlow</span>
            </div>

            <!-- Navigation -->
            <nav class="space-y-2 flex-1">
                <a href="#/" class="nav-item active group">
                    <svg class="w-5 h-5 group-hover:text-violet-glow transition-colors" fill="none"
                        stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6">
                        </path>
                    </svg>
                    <span>Home</span>
                </a>
                <a href="#/explore" class="nav-item group">
                    <svg class="w-5 h-5 group-hover:text-violet-glow transition-colors" fill="none"
                        stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                    <span>Explore</span>
                </a>
                <a href="#/library" class="nav-item group">
                    <svg class="w-5 h-5 group-hover:text-violet-glow transition-colors" fill="none"
                        stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10">
                        </path>
                    </svg>
                    <span>Library</span>
                </a>
            </nav>

            <!-- Flow State Trigger -->
            <button id="flow-trigger"
                class="physics-element mt-auto w-full p-4 rounded-2xl bg-gradient-to-r from-violet-dark/50 to-violet-DEFAULT/50 border border-white/10 hover:border-violet-glow/50 transition-all group overflow-hidden relative">
                <div
                    class="absolute inset-0 bg-violet-glow/20 translate-y-full group-hover:translate-y-0 transition-transform duration-500">
                </div>
                <div class="relative flex items-center justify-center gap-3">
                    <span class="text-xl">✨</span>
                    <span class="font-semibold text-sm tracking-wide">Flow State</span>
                </div>
            </button>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col h-full overflow-hidden relative">
            <!-- Header -->
            <header
                class="physics-element h-20 px-8 flex items-center justify-between border-b border-white/5 bg-charcoal-900/80 backdrop-blur-md z-30">
                <!-- Search -->
                <div class="relative w-96 group">
                    <input type="text" id="global-search" placeholder="Search songs, artists, albums..."
                        class="w-full bg-white/5 border border-white/10 rounded-full py-3 pl-12 pr-4 focus:bg-white/10 focus:border-violet-DEFAULT focus:ring-1 focus:ring-violet-DEFAULT transition-all outline-none placeholder-white/30 text-sm">
                    <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-white/30 group-focus-within:text-violet-glow transition-colors"
                        fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </div>

                <!-- User -->
                <div class="flex items-center gap-4">
                    <button class="p-2 hover:bg-white/5 rounded-full transition-colors relative">
                        <svg class="w-6 h-6 text-white/70" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9">
                            </path>
                        </svg>
                        <span class="absolute top-2 right-2 w-2 h-2 bg-violet-DEFAULT rounded-full"></span>
                    </button>
                    <div
                        class="w-9 h-9 rounded-full bg-gradient-to-tr from-violet-500 to-pink-500 ring-2 ring-charcoal-900">
                    </div>
                </div>
            </header>

            <!-- Dynamic View Container -->
            <div id="main-view" class="flex-1 overflow-y-auto p-8 scroll-smooth pb-32">
                <!-- Views injected here by router.js -->
            </div>
        </main>
    </div>

    <!-- Persistent Player -->
    <div id="player-bar"
        class="physics-element fixed bottom-0 left-0 right-0 h-24 bg-charcoal-800/90 backdrop-blur-2xl border-t border-white/5 z-50 transform transition-transform duration-300">
        <div class="max-w-screen-2xl mx-auto h-full px-6 flex items-center justify-between">

            <!-- Info -->
            <div class="flex items-center gap-4 w-1/3 group cursor-pointer" id="mini-player-info">
                <div class="relative w-14 h-14 rounded-xl overflow-hidden shadow-lg bg-charcoal-700">
                    <img id="player-thumb" src="https://via.placeholder.com/150"
                        class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110">
                    <div
                        class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4">
                            </path>
                        </svg>
                    </div>
                </div>
                <div class="hidden md:block">
                    <h4 id="player-title"
                        class="font-semibold text-white/90 truncate max-w-[200px] group-hover:text-violet-glow transition-colors">
                        Select a track</h4>
                    <p id="player-artist" class="text-xs text-white/50">StreamFlow</p>
                </div>
                <button id="like-btn" class="ml-4 text-white/30 hover:text-violet-500 transition-all hover:scale-110">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z">
                        </path>
                    </svg>
                </button>
            </div>

            <!-- Controls -->
            <div class="flex flex-col items-center gap-2 w-1/3">
                <div class="flex items-center gap-6">
                    <button class="text-white/50 hover:text-white" onclick="player.prev()"><svg class="w-5 h-5"
                            fill="currentColor" viewBox="0 0 24 24">
                            <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z" />
                        </svg></button>
                    <button id="play-btn"
                        class="w-10 h-10 bg-white text-charcoal rounded-full flex items-center justify-center hover:scale-105 transition-transform"
                        onclick="player.togglePlay()">
                        <svg class="w-5 h-5 ml-0.5" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M8 5v14l11-7z" />
                        </svg>
                    </button>
                    <button class="text-white/50 hover:text-white" onclick="player.next()"><svg class="w-5 h-5"
                            fill="currentColor" viewBox="0 0 24 24">
                            <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z" />
                        </svg></button>
                </div>
                <div class="w-full h-1 bg-white/10 rounded-full overflow-hidden relative group cursor-pointer"
                    id="seek-bar">
                    <div id="progress-fill"
                        class="h-full bg-violet-DEFAULT w-0 group-hover:bg-violet-glow transition-colors"></div>
                </div>
            </div>

            <!-- Volume -->
            <div class="flex items-center gap-3 w-1/3 justify-end">
                <svg class="w-5 h-5 text-white/50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z">
                    </path>
                </svg>
                <input type="range" class="w-24 h-1 bg-white/10 rounded-lg appearance-none cursor-pointer"
                    id="volume-slider">
            </div>
        </div>
    </div>

    <!-- Hidden YouTube Iframe -->
    <div id="youtube-player" class="hidden"></div>

    <!-- Full Screen Player Overlay -->
    <div id="full-player-overlay"
        class="fixed inset-0 bg-charcoal-900 z-[60] translate-y-full transition-transform duration-500 flex flex-col items-center justify-center p-8">
        <button id="close-full-player"
            class="absolute top-8 right-8 p-4 bg-white/5 rounded-full hover:bg-white/10 text-white/50 hover:text-white transition-all">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
            </svg>
        </button>
        <div class="absolute inset-0 z-0">
            <div id="overlay-bg" class="w-full h-full bg-cover bg-center opacity-30 blur-3xl scale-110"></div>
            <div class="absolute inset-0 bg-gradient-to-t from-charcoal-900 to-transparent"></div>
        </div>

        <div class="relative z-10 w-full max-w-4xl flex flex-col md:flex-row items-center gap-12">
            <img id="fp-art" src=""
                class="w-full max-w-md aspect-square rounded-[32px] shadow-2xl shadow-black/50 border border-white/10 object-cover">
            <div class="flex-1 text-center md:text-left w-full">
                <h1 id="fp-title" class="text-4xl md:text-6xl font-black mb-4 tracking-tight leading-none"></h1>
                <p id="fp-artist" class="text-xl text-white/60 font-medium mb-12"></p>

                <!-- Full Controls -->
                <div class="flex items-center justify-center md:justify-start gap-8">
                    <button class="p-4 bg-white/10 rounded-full hover:bg-white/20" onclick="player.prev()">
                        <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z" />
                        </svg>
                    </button>
                    <button
                        class="w-24 h-24 bg-white text-charcoal rounded-full flex items-center justify-center hover:scale-105 transition-transform shadow-xl shadow-white/20"
                        onclick="player.togglePlay()">
                        <svg class="w-10 h-10 ml-1" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M8 5v14l11-7z" />
                        </svg>
                    </button>
                    <button class="p-4 bg-white/10 rounded-full hover:bg-white/20" onclick="player.next()">
                        <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modules -->
    <script src="api.js"></script>
    <script src="player.js"></script>
    <script src="physics.js"></script>
    <script src="router.js"></script>
    <script src="app.js"></script>
</body>

</html>
